name: Production regression tests
on:
  push:
    branches: [main, release/2.1.0-production]
  pull_request:
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/validate.mjs
      - run: node tests/production-suite.mjs
