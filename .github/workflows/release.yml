name: Release Adventurer's Tome

on:
  workflow_dispatch:
  push:
    paths:
      - "release/READY"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./module.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'))"

          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const files = [...(manifest.esmodules || []), ...(manifest.styles || [])];
          for (const file of files) {
            if (!fs.existsSync(file)) throw new Error(`Manifest references missing file: ${file}`);
          }
          const forbidden = [
            'scripts/authoring-alpha3-campaign-workspace.js',
            'scripts/authoring-alpha3-tree-sync.js',
            'scripts/authoring-alpha3-tree-v2.js',
            'scripts/authoring-alpha3-world-workspace.js',
            'styles/authoring-alpha3-tree-v2.css',
            'styles/authoring-alpha3-world-workspace.css'
          ];
          for (const file of forbidden) {
            if (fs.existsSync(file)) throw new Error(`Obsolete alpha prototype must not ship: ${file}`);
            if (files.includes(file)) throw new Error(`Manifest must not reference obsolete alpha prototype: ${file}`);
          }
          NODE

          for file in $(node -e "const m=require('./module.json'); console.log((m.esmodules||[]).join(' '))"); do
            node --check "$file"
          done

          test -f templates/tome.hbs
          test -f assets/default-hero.webp
          test -f LICENSE
          test -f README.md
          test ! -f assets/Bree.webp

      - name: Verify release URLs
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('module.json','utf8'));
          const base = `https://github.com/GuteboysFactory/AdventurersTome/releases/download/${m.version}`;
          if (m.manifest !== `${base}/module.json`) throw new Error(`Manifest URL does not match ${m.version}`);
          if (m.download !== `${base}/adventurers-tome.zip`) throw new Error(`Download URL does not match ${m.version}`);
          NODE

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/adventurers-tome-release
          mkdir -p dist /tmp/adventurers-tome-release
          rsync -a ./ /tmp/adventurers-tome-release/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'release/' \
            --exclude 'assets/Bree.webp'
          cp module.json dist/module.json
          cd /tmp/adventurers-tome-release
          zip -qr "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" .
          unzip -t "$GITHUB_WORKSPACE/dist/adventurers-tome.zip"
          FIRST="$(unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | head -n 1)"
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'module.json'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'LICENSE'
          echo "Foundry package root verified; first entry: $FIRST"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_ARGS+=(--prerelease); fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/module.json dist/adventurers-tome.zip --clobber
          else
            gh release create "$VERSION" dist/module.json dist/adventurers-tome.zip \
              --title "Adventurer's Tome $VERSION" \
              --notes "v1.1.0-alpha.8 is the authoring cleanup and hardening pass after the approved alpha.7 permissions baseline. It removes obsolete Explorer/tree/workspace prototypes from the repository, keeps the persistent Campaign Explorer v2 as the only active Explorer implementation, and hardens CI so every manifest-listed script/style must exist while retired alpha prototypes are explicitly forbidden from shipping. Existing authoring, Page Manager, Explorer, folder/entry management, and delegated permissions behavior is intentionally unchanged. This is an alpha QA build; v1.0.0 remains stable." \
              "${PRERELEASE_ARGS[@]}"
          fi
