name: Release Adventurer's Tome

on:
  workflow_dispatch:
  push:
    paths:
      - "release/READY"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./module.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'))"

          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const runtimeFiles = [
            ...(manifest.esmodules || []),
            ...(manifest.styles || []),
            ...((manifest.languages || []).map((entry) => entry.path).filter(Boolean))
          ];
          const required = ['id', 'title', 'version', 'compatibility', 'esmodules', 'styles', 'languages', 'manifest', 'download'];
          for (const key of required) {
            if (manifest[key] == null) throw new Error(`Manifest missing required field: ${key}`);
          }
          if (manifest.id !== 'adventurers-tome') throw new Error(`Unexpected module id: ${manifest.id}`);
          if (!/^1\.(?:1|2|3|4|5)\.\d+(?:-(?:qa|beta|rc)\.\d+)?$/.test(manifest.version)) throw new Error(`Release workflow expects a supported v1.1-v1.5 release, got ${manifest.version}`);
          if (new Set(runtimeFiles).size !== runtimeFiles.length) throw new Error('Manifest contains duplicate runtime file references.');
          for (const file of runtimeFiles) {
            if (!fs.existsSync(file)) throw new Error(`Manifest references missing file: ${file}`);
          }
          for (const language of manifest.languages || []) {
            if (!language.lang || !language.name || !language.path) throw new Error('Language entries require lang, name and path.');
            JSON.parse(fs.readFileSync(language.path, 'utf8'));
          }
          const forbidden = [
            'scripts/authoring-alpha3-campaign-workspace.js',
            'scripts/authoring-alpha3-tree-sync.js',
            'scripts/authoring-alpha3-tree-v2.js',
            'scripts/authoring-alpha3-world-workspace.js',
            'styles/authoring-alpha3-tree-v2.css',
            'styles/authoring-alpha3-world-workspace.css'
          ];
          for (const file of forbidden) {
            if (fs.existsSync(file)) throw new Error(`Obsolete alpha prototype must not ship: ${file}`);
            if (runtimeFiles.includes(file)) throw new Error(`Manifest must not reference obsolete alpha prototype: ${file}`);
          }
          NODE

          for file in $(node -e "const m=require('./module.json'); console.log((m.esmodules||[]).join(' '))"); do
            node --check "$file"
          done

          test -f templates/tome.hbs
          test -f assets/default-hero.webp
          test -f LICENSE
          test -f README.md
          test -f docs/V1.1_BETA_QA_CHECKLIST.md
          test -f docs/V1.1_RC_RELEASE_GATE.md
          if [[ "$VERSION" == 1.2.* ]]; then test -f docs/V1.2_PRIVATE_VAULT_QA.md; fi
          if [[ "$VERSION" == "1.2.0-qa.5" ]]; then test -f docs/V1.2_QA5_VAULT_BROWSER_QA.md; fi
          if [[ "$VERSION" == 1.3.* ]]; then test -f docs/V1.3_QA1_UNIVERSAL_DOCUMENT_REGISTRY.md; fi
          if [[ "$VERSION" == 1.4.* ]]; then test -f docs/V1.4_QA1_GM_DOCK_FOUNDATION.md; fi
          if [[ "$VERSION" == 1.5.* ]]; then test -f docs/V1.5_QA1_FORMAL_ADAPTER_API.md; fi
          test ! -f assets/Bree.webp

      - name: Verify release URLs
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('module.json','utf8'));
          const versionBase = `https://github.com/GuteboysFactory/AdventurersTome/releases/download/${m.version}`;
          const latestManifest = 'https://github.com/GuteboysFactory/AdventurersTome/releases/latest/download/module.json';
          const versionManifest = `${versionBase}/module.json`;
          const testManifest = 'https://raw.githubusercontent.com/GuteboysFactory/AdventurersTome/main/channels/test/module.json';
          const goldManifest = 'https://raw.githubusercontent.com/GuteboysFactory/AdventurersTome/main/channels/gold/module.json';
          if (![latestManifest, versionManifest, testManifest, goldManifest].includes(m.manifest)) throw new Error(`Manifest URL is not a supported update channel for ${m.version}`);
          if (m.download !== `${versionBase}/adventurers-tome.zip`) throw new Error(`Download URL does not match ${m.version}`);
          NODE

      - name: Build Foundry package
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist /tmp/adventurers-tome-release
          mkdir -p dist /tmp/adventurers-tome-release
          rsync -a ./ /tmp/adventurers-tome-release/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'release/' \
            --exclude 'channels/' \
            --exclude 'assets/Bree.webp'
          cp module.json dist/module.json
          cd /tmp/adventurers-tome-release
          zip -qr "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" .
          unzip -t "$GITHUB_WORKSPACE/dist/adventurers-tome.zip"

          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'module.json'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'LICENSE'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'README.md'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.1_BETA_QA_CHECKLIST.md'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.1_RC_RELEASE_GATE.md'
          if [[ "$VERSION" == 1.2.* ]]; then unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.2_PRIVATE_VAULT_QA.md'; fi
          if [[ "$VERSION" == "1.2.0-qa.5" ]]; then unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.2_QA5_VAULT_BROWSER_QA.md'; fi
          if [[ "$VERSION" == 1.3.* ]]; then unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.3_QA1_UNIVERSAL_DOCUMENT_REGISTRY.md'; fi
          if [[ "$VERSION" == 1.4.* ]]; then unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.4_QA1_GM_DOCK_FOUNDATION.md'; fi
          if [[ "$VERSION" == 1.5.* ]]; then unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'docs/V1.5_QA1_FORMAL_ADAPTER_API.md'; fi

          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const listed = cp.execFileSync('unzip', ['-Z1', 'dist/adventurers-tome.zip'], { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' })
            .split(/\r?\n/).filter(Boolean);
          const files = new Set(listed);
          for (const file of [...(m.esmodules || []), ...(m.styles || []), ...((m.languages || []).map((entry) => entry.path).filter(Boolean))]) {
            if (!files.has(file)) throw new Error(`Release ZIP is missing manifest runtime file: ${file}`);
          }
          const forbiddenPrefixes = ['.git/', '.github/', 'dist/', 'release/', 'channels/'];
          for (const file of listed) {
            if (forbiddenPrefixes.some((prefix) => file.startsWith(prefix))) throw new Error(`Release ZIP contains excluded path: ${file}`);
          }
          const retired = [
            'scripts/authoring-alpha3-campaign-workspace.js',
            'scripts/authoring-alpha3-tree-sync.js',
            'scripts/authoring-alpha3-tree-v2.js',
            'scripts/authoring-alpha3-world-workspace.js',
            'styles/authoring-alpha3-tree-v2.css',
            'styles/authoring-alpha3-world-workspace.css'
          ];
          for (const file of retired) if (files.has(file)) throw new Error(`Release ZIP contains retired prototype: ${file}`);
          NODE

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_ARGS+=(--prerelease); fi
          NOTES="Adventurer's Tome $VERSION test build."
          if [[ "$VERSION" == "1.2.0-qa.5" ]]; then
            NOTES="v1.2.0-qa.5 adds the GM-only campaign-wide Private Vault Browser with canonical Actor/helper-Journal deduplication, search and filters, contextual Tome links/backlinks, safe missing-source display, and source-opening navigation. It preserves the verified qa.2 Source Parity foundation and qa.3/qa.4 DialogV2/header polish."
          fi
          if [[ "$VERSION" == "1.3.0-qa.1" ]]; then
            NOTES="v1.3.0-qa.1 starts Foundry Source Parity II with a shadow/read-only Universal Document Registry for Actor, Item, JournalEntry, JournalEntryPage, Scene and Folder UUID identity. Existing v1.2 behavior remains live authority."
          fi
          if [[ "$VERSION" == "1.3.0" ]]; then
            NOTES="Adventurer's Tome v1.3.0 completes Foundry Source Parity II / Universal Document Takeover. The stable release includes the Universal Document Registry, permission-aware reads, Search/Navigation and Explorer/Catalog convergence, lifecycle and imported-source identity hardening, canonical takeover resolution, Campaign Entity Links v1, and the verified Universal Convergence Gate on Foundry V13.351."
          fi
          if [[ "$VERSION" == "1.4.0-qa.1" ]]; then
            NOTES="v1.4.0-qa.1 starts Tome GM Dock with a compact persistent GM-only command surface, current-context awareness, contextual Private Vault access, Quick Capture, Reveal Queue, Next Session, recent navigation, pinning, draggable per-user placement and a future-safe internal action registry. Foundry V13.351 remains the verified runtime baseline."
          fi
          if [[ "$VERSION" == "1.4.0-qa.2" ]]; then
            NOTES="v1.4.0-qa.2 unifies GM Dock presentation through a neutral host/provider contract. With Realm Guard / Torchbearer v1.9.0-qa.7 active, Tome becomes an integrated campaign-workspace menu inside the Realm Guard GM Dock; without a compatible host, Tome keeps its standalone Dock fallback. Canonical Tome data and Private Vault ownership remain unchanged."
          fi
          if [[ "$VERSION" == "1.4.0-qa.3" ]]; then
            NOTES="v1.4.0-qa.3 is a focused hotfix for the unified GM Dock QA line. It corrects the Private Vault ready-hook module-id reference so the contextual Private Vault open API registers cleanly at world ready. No Dock architecture or campaign data model changes are introduced."
          fi
          if [[ "$VERSION" == "1.4.0-qa.4" ]]; then
            NOTES="v1.4.0-qa.4 hardens Tome API composition. Core ready no longer replaces extension APIs, and GM Dock plus contextual Private Vault APIs merge into stable shared objects. This removes the ready-hook race that could erase gmDock and contextualPrivateVault.open while preserving the unified Dock architecture."
          fi
          if [[ "$VERSION" == "1.4.0-qa.5" ]]; then
            NOTES="v1.4.0-qa.5 polishes the unified GM Dock experience: compact inline Quick Capture inside compatible host v2 menus, canonical Foundry context support for Private Vault including Scene/Item contexts, three-item recent navigation, and a persistent Open Adventurer's Tome footer. Standalone Tome Dock remains the fallback."
          fi
          if [[ "$VERSION" == "1.4.0-qa.6" ]]; then
            NOTES="v1.4.0-qa.6 is a focused GM Dock Quick Capture UX polish: Quick Capture is collapsed by default, expands inline on demand, uses a vertical select layout to avoid Foundry select compression, and collapses again after a successful save. No campaign data model or host architecture changes are introduced."
          fi
          if [[ "$VERSION" == "1.4.0-qa.7" ]]; then
            NOTES="v1.4.0-qa.7 hardens the system-independent GM Dock lifecycle: stale pinned UUID recovery, deleted-context cleanup, explicit Quick Capture target preservation across host refreshes, generic host compatibility diagnostics, and QA coverage for standalone, Host v1/v2+, privacy and multi-client behavior. Reference-system versions are not runtime dependencies."
          fi
          if [[ "$VERSION" == "1.4.0-qa.8" ]]; then
            NOTES="v1.4.0-qa.8 is the v1.4 release-hardening and RC-gate build. It adds a deterministic runtime releaseGate() diagnostic, hardens generic host re-registration/replacement, verifies public API composition and v1.3 convergence preservation, and defines standalone/hosted/privacy/reload/console-clean promotion criteria for v1.4.0-rc.1."
          fi
          if [[ "$VERSION" == "1.4.0-qa.9" ]]; then
            NOTES="v1.4.0-qa.9 is a focused RC-gate semantics hotfix. It clarifies that the v1.3 qaComplete signal is session-local runtime evidence, not a v1.4 release requirement, and exposes takeover misses plus explicit runtimeEvidenceRequiredForRelease=false in the v1.4 release gate. No campaign feature or canonical-source behavior changes are introduced."
          fi
          if [[ "$VERSION" == "1.4.0-rc.1" ]]; then
            NOTES="Adventurer's Tome v1.4.0-rc.1 is the feature-frozen release candidate for the Tome GM Dock milestone. It carries the system-independent standalone Dock, optional capability-driven GM Dock Host integration, canonical contextual Private Vault/Quick Capture workflows, hardened lifecycle and multi-client behavior, and the verified v1.4 runtime release gate on Foundry V13.351. RC scope is blocker-only; no new features are introduced."
          fi
          if [[ "$VERSION" == "1.4.0" ]]; then
            NOTES="Adventurer's Tome v1.4.0 completes the Tome GM Dock milestone. It adds a system-independent standalone GM Dock, optional capability-driven gbf-gm-dock-host integration, canonical contextual Private Vault and Quick Capture workflows, Reveal Queue and Next Session access, stale-context and host-lifecycle hardening, multi-client/privacy protection, and a deterministic runtime release gate. The release is verified on Foundry V13.351; V14 runtime verification remains separate."
          fi
          if [[ "$VERSION" == "1.5.0-qa.1" ]]; then
            NOTES="Adventurer's Tome v1.5.0-qa.1 starts the Formal Adapter API milestone. It exposes a versioned system-agnostic adapter registry through module.api.adapters with safe registration, capability discovery/execution, priority ordering, audit diagnostics and backward-compatible enrichment bridging. Existing Genesys Talent enrichment is retained as an optional reference adapter; Tome Core remains fully functional without any adapter."
          fi
          if [[ "$VERSION" == "1.5.0-qa.2" ]]; then
            NOTES="Adventurer's Tome v1.5.0-qa.2 adds typed Adapter API helper surfaces and a safe action bridge. displayFields/mapActor/mapItem/actions/invokeAction normalize capability results, namespace adapter actions, contain execution failures, and surface GM-only system actions through both standalone and compatible hosted GM Docks without hard-coding any game system into Tome Core."
          fi
          if [[ "$VERSION" == "1.5.0-qa.3" ]]; then
            NOTES="Adventurer's Tome v1.5.0-qa.3 is a focused startup hotfix for the optional Genesys reference adapter. Early ESModule registration now prefers the already-created global Adapter API bridge and guards formal module lookup until game.modules exists, removing the startup TypeError without changing the Adapter API contract or action bridge."
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/module.json dist/adventurers-tome.zip --clobber
          else
            gh release create "$VERSION" dist/module.json dist/adventurers-tome.zip \
              --title "Adventurer's Tome $VERSION" \
              --notes "$NOTES" \
              "${PRERELEASE_ARGS[@]}"
          fi
