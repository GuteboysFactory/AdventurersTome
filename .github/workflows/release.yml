name: Release Adventurer's Tome

on:
  workflow_dispatch:
  push:
    paths:
      - "release/READY"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./module.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'))"
          node --check scripts/adventurers-tome.js
          node --check scripts/structured-journals.js
          node --check scripts/content-importer.js
          node --check scripts/reading-polish.js
          node --check scripts/universal-sharing.js
          node --check scripts/world-journal-parity.js
          node --check scripts/world-inline-editing.js
          node --check scripts/authoring-foundation.js
          node --check scripts/authoring-summary-sync.js
          node --check scripts/authoring-editor-bridge.js
          node --check scripts/authoring-alpha2.js
          node --check scripts/world-journal-log-polish.js
          node --check scripts/authoring-empty-pages.js
          node --check scripts/authoring-alpha3.js
          node --check scripts/authoring-alpha3-campaign-workspace.js
          test -f styles/adventurers-tome.css
          test -f styles/structured-journals.css
          test -f styles/content-importer.css
          test -f styles/reading-polish.css
          test -f styles/universal-sharing.css
          test -f styles/world-journal-parity.css
          test -f styles/world-inline-editing.css
          test -f styles/authoring-foundation.css
          test -f styles/authoring-alpha2.css
          test -f styles/world-journal-log-polish.css
          test -f styles/authoring-empty-pages.css
          test -f styles/authoring-alpha3.css
          test -f styles/authoring-alpha3-campaign-workspace.css
          test -f templates/tome.hbs
          test -f assets/default-hero.webp
          test -f LICENSE
          test -f README.md
          test ! -f assets/Bree.webp

      - name: Verify release URLs
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('module.json','utf8'));
          const base = `https://github.com/GuteboysFactory/AdventurersTome/releases/download/${m.version}`;
          if (m.manifest !== `${base}/module.json`) throw new Error(`Manifest URL does not match ${m.version}`);
          if (m.download !== `${base}/adventurers-tome.zip`) throw new Error(`Download URL does not match ${m.version}`);
          NODE

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/adventurers-tome-release
          mkdir -p dist /tmp/adventurers-tome-release
          rsync -a ./ /tmp/adventurers-tome-release/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'release/' \
            --exclude 'assets/Bree.webp'
          cp module.json dist/module.json
          cd /tmp/adventurers-tome-release
          zip -qr "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" .
          unzip -t "$GITHUB_WORKSPACE/dist/adventurers-tome.zip"
          FIRST="$(unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | head -n 1)"
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'module.json'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/adventurers-tome.zip" | grep -qx 'LICENSE'
          echo "Foundry package root verified; first entry: $FIRST"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_ARGS+=(--prerelease); fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/module.json dist/adventurers-tome.zip --clobber
          else
            gh release create "$VERSION" dist/module.json dist/adventurers-tome.zip \
              --title "Adventurer's Tome $VERSION" \
              --notes "v1.1.0-alpha.3 now uses one Foundry-backed Campaign Workspace for World, Quests and Sessions. Tome mirrors the real Foundry Journal folder hierarchy, including multiple Tome/demo roots, and presents that hierarchy through a cleaner Explorer plus folder/entry cards in the main workspace. Drag-and-drop moves real Journal Entries or folders, and GM adoption can turn an ordinary Foundry Journal into the selected Tome section without a separate import step. Editor permissions remain separate and GM Notes stay private. Carries forward alpha.2 hero drag-and-drop, Page Manager and Journal-backed autosave authoring. This is an alpha QA build; v1.0.0 remains stable." \
              "${PRERELEASE_ARGS[@]}"
          fi
