name: Bootstrap Adventurer's Tome RC

on:
  workflow_dispatch:
  push:
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.0-rc.1
      REPO_URL: https://github.com/GuteboysFactory/AdventurersTome
      MANIFEST_URL: https://github.com/GuteboysFactory/AdventurersTome/releases/latest/download/module.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded RC archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk_* > /tmp/adventurers-tome-rc.b64
          base64 --decode /tmp/adventurers-tome-rc.b64 > /tmp/adventurers-tome-rc.zip
          unzip -t /tmp/adventurers-tome-rc.zip
          rm -rf /tmp/atome-unpack
          mkdir -p /tmp/atome-unpack
          unzip -q /tmp/adventurers-tome-rc.zip -d /tmp/atome-unpack
          test -f /tmp/atome-unpack/adventurers-tome/module.json
          test -f /tmp/atome-unpack/adventurers-tome/scripts/adventurers-tome.js
          test -f /tmp/atome-unpack/adventurers-tome/styles/adventurers-tome.css
          test -f /tmp/atome-unpack/adventurers-tome/templates/tome.hbs
          cp -a /tmp/atome-unpack/adventurers-tome/. ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-rc.yml

      - name: Stamp repository metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'module.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.url = 'https://github.com/GuteboysFactory/AdventurersTome';
          manifest.manifest = 'https://github.com/GuteboysFactory/AdventurersTome/releases/latest/download/module.json';
          manifest.download = 'https://github.com/GuteboysFactory/AdventurersTome/releases/download/1.0.0-rc.1/adventurers-tome.zip';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          sed -i 's#github.com/OWNER/REPO#github.com/GuteboysFactory/AdventurersTome#g' docs/GITHUB-RELEASE.md

      - name: Commit complete RC source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GuteboysFactory Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Adventurer's Tome v1.0.0-rc.1 source and release pipeline"
          git push

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/adventurers-tome
          rsync -a ./ dist/adventurers-tome/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'bootstrap/' \
            --exclude 'assets/Bree.webp'
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/adventurers-tome/module.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = '1.0.0-rc.1';
          manifest.url = 'https://github.com/GuteboysFactory/AdventurersTome';
          manifest.manifest = 'https://github.com/GuteboysFactory/AdventurersTome/releases/latest/download/module.json';
          manifest.download = 'https://github.com/GuteboysFactory/AdventurersTome/releases/download/1.0.0-rc.1/adventurers-tome.zip';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          fs.copyFileSync(path, 'dist/module.json');
          NODE
          cd dist
          zip -qr adventurers-tome.zip adventurers-tome
          unzip -t adventurers-tome.zip

      - name: Publish RC release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/module.json dist/adventurers-tome.zip --clobber
          else
            gh release create "$VERSION" dist/module.json dist/adventurers-tome.zip \
              --title "Adventurer's Tome $VERSION" \
              --notes "Release candidate for Foundry VTT 13.351. Install using the version-specific module.json asset and run the final RC regression before promotion to 1.0.0." \
              --prerelease
          fi
