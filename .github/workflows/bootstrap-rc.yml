name: Bootstrap Adventurer's Tome RC

on:
  workflow_dispatch:
  push:
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.0-rc.1
      ARCHIVE: adventurers-tome-v1.0.0-rc.1.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack uploaded RC archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          rm -rf /tmp/atome-unpack
          mkdir -p /tmp/atome-unpack
          unzip -q "$ARCHIVE" -d /tmp/atome-unpack
          test -f /tmp/atome-unpack/adventurers-tome/module.json
          test -f /tmp/atome-unpack/adventurers-tome/scripts/adventurers-tome.js
          test -f /tmp/atome-unpack/adventurers-tome/styles/adventurers-tome.css
          test -f /tmp/atome-unpack/adventurers-tome/templates/tome.hbs
          cp -a /tmp/atome-unpack/adventurers-tome/. ./

      - name: Stamp RC manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'module.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          m.version = '1.0.0-rc.1';
          m.url = 'https://github.com/GuteboysFactory/AdventurersTome';
          m.manifest = 'https://github.com/GuteboysFactory/AdventurersTome/releases/download/1.0.0-rc.1/module.json';
          m.download = 'https://github.com/GuteboysFactory/AdventurersTome/releases/download/1.0.0-rc.1/adventurers-tome.zip';
          fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          NODE

      - name: Commit complete RC source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE"
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-rc.yml
          git config user.name "GuteboysFactory Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Adventurer's Tome v1.0.0-rc.1 source"
          git push

      - name: Build RC release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/adventurers-tome
          rsync -a ./ dist/adventurers-tome/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'bootstrap/' \
            --exclude 'assets/Bree.webp'
          cp module.json dist/module.json
          cd dist
          zip -qr adventurers-tome.zip adventurers-tome
          unzip -t adventurers-tome.zip

      - name: Publish RC release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/module.json dist/adventurers-tome.zip --clobber
          else
            gh release create "$VERSION" dist/module.json dist/adventurers-tome.zip \
              --title "Adventurer's Tome $VERSION" \
              --notes "Release candidate for Foundry VTT 13.351. Install from the release module.json and run the final regression before promotion to v1.0.0." \
              --prerelease
          fi
